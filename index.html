<!DOCTYPE html>
<html lang="es" data-skin="win95">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="CV de Daniel Álvarez Alfonso — Desarrollador Web en Formación" />
  <title>Daniel Álvarez Alfonso — CV</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💾</text></svg>" />

  <!-- Aplica el tema guardado antes de pintar (evita parpadeo) -->
  <script>try { var s = localStorage.getItem("cv-skin"); if (s === "win95" || s === "ubuntu") document.documentElement.dataset.skin = s; } catch (e) {}</script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono&family=VT323&display=swap" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/win95.css" />
  <link rel="stylesheet" href="css/ubuntu.css" />
</head>
<body>
  <a href="#desktop" class="skip-link">Saltar al contenido</a>

  <!-- Barra del sistema: barra de tareas (Win95, abajo) o panel GNOME (Ubuntu, arriba) -->
  <nav class="os-bar" aria-label="Menú del sistema">
    <!-- Windows 95: botón Inicio -->
    <div class="dropdown dropup only-win95">
      <button class="os-btn start-btn" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        <svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true"><rect x="0" y="0" width="7" height="6" fill="#f00"/><rect x="8" y="0" width="7" height="6" fill="#0a0"/><rect x="0" y="7" width="7" height="6" fill="#00f"/><rect x="8" y="7" width="7" height="6" fill="#fc0"/></svg>
        <b>Inicio</b>
      </button>
      <div class="dropdown-menu start-menu">
        <div class="start-menu__band" aria-hidden="true">Windows<b>95</b></div>
        <div class="start-menu__items" data-menu="apps places system"></div>
      </div>
    </div>
    <span class="os-btn task-btn only-win95">📄 CV — Daniel Álvarez</span>

    <!-- Ubuntu 10.04: menús del panel -->
    <div class="dropdown only-ubuntu">
      <button class="os-btn" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="none" stroke="#f07746" stroke-width="2"/><circle cx="8" cy="2.2" r="1.8" fill="#f07746"/><circle cx="2.9" cy="11" r="1.8" fill="#f07746"/><circle cx="13.1" cy="11" r="1.8" fill="#f07746"/></svg>
        Aplicaciones
      </button>
      <div class="dropdown-menu" data-menu="apps"></div>
    </div>
    <div class="dropdown only-ubuntu">
      <button class="os-btn" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Lugares</button>
      <div class="dropdown-menu" data-menu="places"></div>
    </div>
    <div class="dropdown only-ubuntu">
      <button class="os-btn" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Sistema</button>
      <div class="dropdown-menu" data-menu="system"></div>
    </div>

    <!-- Bandeja: sonido + reloj -->
    <div class="os-tray ml-auto">
      <button class="os-btn tray-btn" id="mute-btn" aria-label="Silenciar sonidos" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path class="waves" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.3"/><path class="cross" d="M11 5.5l4 5M15 5.5l-4 5" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <span class="os-clock" id="clock"></span>
      <span class="os-user only-ubuntu">Daniel</span>
    </div>
  </nav>

  <!-- Escritorio: main.js pinta aquí una ventana por sección -->
  <main id="desktop" class="container"></main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
